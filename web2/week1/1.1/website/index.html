<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <header class="header">
        <div class="header-left">

            <!-- <div class="logo"> -->
            <div class="logo">

                <span>

                    <img src="vscodelogo.png" height="25px" width="25px" alt="vscodelogo">
                </span>
                <span
                    style="font-size:20px; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;">Visual
                    Studio Code</span>
            </div>

            <span>Docs</span><span>Updates</span><span>Blog</span><span>API</span><span>Extensions</span><span>MCP</span><span>FAQ</span>
            <!-- </div> -->
        </div>
        <div class="header-right">
            <div class="dark-mode"><img src="theme-light.svg" alt="dark-mode"></div>
            <div class="search" style="border: 1px solid rgba(255, 255, 255, 0.15)
; display: flex; align-items: center;border-radius: 0.25rem; padding: 0.25rem 0.25rem;">
                <span><img src="search-dark.svg" alt="serach"></span>
                <input type="search" name="" id="" style="width:1px;border: none; background-color: #0d1117;">
                <span style="font-size: medium; color: #9ba3b4
;
                font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
                ">Search Docs</span><span style="font-size: x-small; color: grey;">Ctrl+Shift+P</span>
            </div>
            <div class="download-btn" style="background-color: #0078d4
; color: white; border-radius: 0.25rem; padding: 0.5rem 1rem;">Download</div>
        </div>
    </header>
    <section class="main">
        <div class="section-1">
            <h1 style="font-size: 4rem;">The Open Source <br> AI code editor</h1>
            <div class="hero">
                <div class="download-logo"><span><img src="windowslogo.png" style="width: 30px; height: 30px;"
                            alt="windows"></span><span style="font-size: large;">Download for Windows</span></div>
                <div style="font-size: small;">
                    <span><a href="http://" class="link">Web</a></span>
                    <span><a href="http://" class="link">Insiders edition</a></span>
                    <span><a href="http://" class="link">other platforms</a></span>
                </div>
                <div style="font-size: small;">
                    By using VS Code, you agree to its <span><a href="http://" class="link">license</a></span>
                    and <span>
                        <a href="http://" class="link">privacy statement</a>
                    </span>
                </div>
            </div>
        </div>
        <div class="section-2">
            <img src="vscode.png" style="width: 100%;  " alt="vscode">
        </div>
        <div class="section-3">
            <img src="section3.1.png" style="height:440px;width: 400px;" alt=" vscode">
            <img src="section3.2.png" style="height:440px; width: 400px;" alt="vscode">
            <img src="section3.3.png" style="height:440px; width: 400px;" alt="vscode">
        </div>
    </section>
    <footer>
        linkedin facebook etc
    </footer>
